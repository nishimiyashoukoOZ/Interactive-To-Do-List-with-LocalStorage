<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5ef">
  <title>Interncircle | To-do list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">d</span><span>Interncircle</span></div>
      <div class="date-label" id="date-label"></div>
    </div>

    <h1>A little more focus.</h1>
    <p class="intro">Make room for what matters today.</p>

    <section class="list-panel" aria-label="To-do list">
      <form class="add-form" id="add-form">
        <label for="task-input" class="visually-hidden">Add a task</label>
        <input class="task-input" id="task-input" type="text" maxlength="240" placeholder="What needs doing?" autocomplete="off" required>
        <button class="add-button" type="submit">Add task</button>
      </form>

      <div class="list-toolbar" aria-label="Task list controls">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">To do</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
        </div>
        <span class="task-count" id="task-count" aria-live="polite"></span>
      </div>

      <ul class="task-list" id="task-list" aria-label="Tasks"></ul>
      <div class="empty-state" id="empty-state" hidden>
        <span class="empty-mark" aria-hidden="true">&#10003;</span>
        <p class="empty-title" id="empty-title">A clear start.</p>
        <p class="empty-copy" id="empty-copy">Add a task and take it one step at a time.</p>
      </div>

      <footer class="list-footer">
        <span id="progress-label"></span>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </footer>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
